<!DOCTYPE html>
<html>
<head>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <meta content="width=device-width,initial-scale=1,user-scalable=no" name="viewport">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="white">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" >
  <title></title>
  <script>
    // Taro4 H5：1rpx = 1/40 rem（750rpx = 18.75rem 应铺满视口宽）
    // 旧版 a/320*20 是 Taro1 的 640 设计稿方案，会把 750rpx 放大 ~17% 造成横向溢出
    !function () {
      function setRoot() {
        var w = document.documentElement.clientWidth || window.innerWidth
        if (!w) return
        // 视口超过 750px 时锁定，配合 #app max-width 居中呈现手机版式
        document.documentElement.style.fontSize = (Math.min(w, 750) / 750) * 40 + 'px'
      }
      setRoot()
      window.addEventListener('resize', setRoot)
      window.addEventListener('orientationchange', setRoot)
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setRoot)
    }(window)
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #f5f7fb; }
    #app { max-width: 750px; margin: 0 auto; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>
</body>
</html>
